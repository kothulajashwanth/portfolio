<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./Portfolio/" />
    <title>Redirecting to Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #06070b;
        color: #f7f8fc;
      }
      .card {
        text-align: center;
        padding: 2rem;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 1rem;
        background: rgba(255,255,255,0.06);
      }
      a {
        color: #a3e635;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to your portfolio…</h1>
      <p>If it does not open automatically, <a href="./Portfolio/">click here</a>.</p>

</html>
